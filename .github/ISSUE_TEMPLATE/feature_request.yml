name: Feature request
description: Suggest an idea or enhancement for MemoProAgent.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Do not upload private keys, credentials,
        private personal memories, or restricted videos (including Ego4D
        footage).
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve and for whom?
      placeholder: |
        As a ..., I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the proposed API, behavior, or docs change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context and config
      description: Relevant config, environment, or redacted examples.
    validations:
      required: false
